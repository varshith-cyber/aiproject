<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>🎬 Movie Recommender</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0f0f1a;--surface:#1a1a2e;--card:#16213e;--border:#0f3460;
    --accent:#e94560;--accent2:#533483;--text:#e8e8f0;--muted:#8888aa;
    --success:#22c55e;--warn:#f59e0b;
  }
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}

  /* ── HEADER ── */
  header{
    background:linear-gradient(135deg,#0f3460 0%,#533483 50%,#e94560 100%);
    padding:2rem;text-align:center;
    box-shadow:0 4px 20px rgba(233,69,96,.4);
  }
  header h1{font-size:2.4rem;font-weight:800;letter-spacing:2px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
  header p{color:rgba(255,255,255,.75);margin-top:.4rem;font-size:.95rem}

  /* ── LAYOUT ── */
  .container{max-width:1300px;margin:0 auto;padding:2rem 1rem}
  .grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.5rem;margin-bottom:2rem}

  /* ── STAT CARDS ── */
  .stat-card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:1.4rem;text-align:center;position:relative;overflow:hidden;
    transition:transform .2s,box-shadow .2s;
  }
  .stat-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(233,69,96,.25)}
  .stat-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
  }
  .stat-num{font-size:2.4rem;font-weight:800;color:var(--accent)}
  .stat-label{color:var(--muted);font-size:.85rem;margin-top:.3rem;text-transform:uppercase;letter-spacing:1px}

  /* ── PANEL ── */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.6rem;margin-bottom:1.5rem}
  .panel-title{font-size:1.1rem;font-weight:700;margin-bottom:1.2rem;color:var(--accent);
    display:flex;align-items:center;gap:.5rem}

  /* ── CONTROLS ── */
  .controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1rem}
  label{font-size:.8rem;color:var(--muted);display:block;margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.5px}
  select,input{
    width:100%;padding:.7rem 1rem;background:var(--card);border:1px solid var(--border);
    border-radius:8px;color:var(--text);font-size:.9rem;outline:none;transition:border-color .2s;
  }
  select:focus,input:focus{border-color:var(--accent)}

  /* ── ALGO TABS ── */
  .algo-tabs{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.4rem}
  .algo-btn{
    padding:.5rem 1.1rem;border-radius:50px;border:1px solid var(--border);
    background:transparent;color:var(--muted);cursor:pointer;font-size:.82rem;
    transition:all .2s;font-weight:600;letter-spacing:.5px;
  }
  .algo-btn:hover{border-color:var(--accent);color:var(--text)}
  .algo-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 12px rgba(233,69,96,.5)}

  /* ── RECOMMEND BUTTON ── */
  .rec-btn{
    display:inline-flex;align-items:center;gap:.5rem;
    padding:.8rem 2rem;background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;border-radius:50px;color:#fff;font-size:.95rem;font-weight:700;
    cursor:pointer;transition:all .2s;box-shadow:0 4px 15px rgba(233,69,96,.4);letter-spacing:.5px;
  }
  .rec-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(233,69,96,.6)}
  .rec-btn:active{transform:translateY(0)}

  /* ── MOVIE CARDS ── */
  .results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.2rem;margin-top:1.2rem}
  .movie-card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:1.2rem;position:relative;overflow:hidden;transition:all .3s;cursor:default;
  }
  .movie-card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 8px 24px rgba(233,69,96,.2)}
  .movie-rank{
    position:absolute;top:.8rem;right:.8rem;
    background:var(--accent);color:#fff;border-radius:50%;
    width:28px;height:28px;display:flex;align-items:center;justify-content:center;
    font-size:.75rem;font-weight:800;
  }
  .movie-title{font-weight:700;font-size:.95rem;margin-bottom:.4rem;line-height:1.3;padding-right:30px}
  .movie-year{font-size:.78rem;color:var(--muted);margin-bottom:.5rem}
  .genre-tag{
    display:inline-block;padding:.15rem .6rem;background:rgba(83,52,131,.4);
    border:1px solid var(--accent2);border-radius:50px;font-size:.7rem;color:#c4b5fd;
    margin:.15rem .1rem;
  }
  .movie-score-bar{margin-top:.8rem}
  .score-label{font-size:.72rem;color:var(--muted);margin-bottom:.3rem;display:flex;justify-content:space-between}
  .score-track{background:rgba(255,255,255,.08);border-radius:50px;height:5px;overflow:hidden}
  .score-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:50px;transition:width .6s ease}
  .imdb-badge{
    display:inline-flex;align-items:center;gap:.3rem;font-size:.75rem;
    background:rgba(245,158,11,.15);color:var(--warn);border:1px solid rgba(245,158,11,.3);
    border-radius:4px;padding:.1rem .4rem;margin-top:.5rem;
  }

  /* ── LOADING / EMPTY ── */
  .loading{text-align:center;padding:2rem;color:var(--muted)}
  .spinner{
    width:36px;height:36px;border:3px solid rgba(233,69,96,.2);border-top-color:var(--accent);
    border-radius:50%;animation:spin .7s linear infinite;margin:0 auto .8rem;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty{text-align:center;padding:2.5rem;color:var(--muted);font-size:.9rem}
  .empty-icon{font-size:2.5rem;margin-bottom:.5rem}

  /* ── ALGO INFO BADGE ── */
  .algo-info{
    display:flex;align-items:center;gap:.5rem;padding:.6rem 1rem;
    background:rgba(83,52,131,.2);border:1px solid var(--accent2);border-radius:8px;
    font-size:.82rem;color:#c4b5fd;margin-bottom:1rem;
  }

  /* ── SIMILARITY HEATMAP ── */
  .heatmap-container{overflow-x:auto}
  table.heatmap{border-collapse:collapse;font-size:.7rem;min-width:300px}
  table.heatmap th,table.heatmap td{padding:.35rem .5rem;border:1px solid var(--border);text-align:center}
  table.heatmap th{background:var(--card);color:var(--muted);font-weight:600}

  /* ── TOAST ── */
  #toast{
    position:fixed;bottom:1.5rem;right:1.5rem;padding:.8rem 1.4rem;
    background:var(--success);color:#fff;border-radius:8px;font-size:.85rem;
    transform:translateY(60px);opacity:0;transition:all .3s;z-index:999;
  }
  #toast.show{transform:translateY(0);opacity:1}
</style>
</head>
<body>

<header>
  <h1>🎬 Movie Recommendation System</h1>
  <p>Content-Based • User-Based CF • Item-Based CF • SVD Matrix Factorisation • Hybrid</p>
</header>

<div class="container">

  <!-- ── STATS ── -->
  <div class="grid-3" id="stats-row">
    <div class="stat-card"><div class="stat-num" id="s-movies">—</div><div class="stat-label">🎥 Movies</div></div>
    <div class="stat-card"><div class="stat-num" id="s-users">—</div><div class="stat-label">👤 Users</div></div>
    <div class="stat-card"><div class="stat-num" id="s-ratings">—</div><div class="stat-label">⭐ Ratings</div></div>
    <div class="stat-card"><div class="stat-num" id="s-avg">—</div><div class="stat-label">📊 Avg Rating</div></div>
    <div class="stat-card"><div class="stat-num" id="s-sparsity">—</div><div class="stat-label">🕳 Sparsity</div></div>
  </div>

  <!-- ── RECOMMENDER PANEL ── -->
  <div class="panel">
    <div class="panel-title">🤖 Get Recommendations</div>

    <!-- Algorithm selector -->
    <div class="algo-tabs">
      <button class="algo-btn" data-algo="content" title="Recommends movies similar to a chosen film">📽 Content-Based</button>
      <button class="algo-btn" data-algo="usercf"  title="Find users like you, borrow their taste">👥 User-Based CF</button>
      <button class="algo-btn" data-algo="itemcf"  title="Find similar items to what you rated">🎞 Item-Based CF</button>
      <button class="algo-btn" data-algo="svd"     title="Latent-factor decomposition">🔢 SVD</button>
      <button class="algo-btn active" data-algo="hybrid" title="Blended score from all models">✨ Hybrid</button>
    </div>

    <div id="algo-info" class="algo-info"></div>

    <div class="controls">
      <div id="ctrl-user">
        <label>Select User</label>
        <select id="user-select">
          {% for u in users %}
          <option value="{{ u.user_id }}">User {{ u.user_id }} – {{ u.name }} ({{ u.preferred_genres }})</option>
          {% endfor %}
        </select>
      </div>
      <div id="ctrl-movie">
        <label>Reference Movie (Content-Based)</label>
        <select id="movie-select">
          {% for m in movies %}
          <option value="{{ m.movie_id }}">{{ m.title }} ({{ m.year }})</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label>Number of Recommendations</label>
        <select id="topn-select">
          <option value="3">3</option>
          <option value="5" selected>5</option>
          <option value="8">8</option>
          <option value="10">10</option>
        </select>
      </div>
    </div>

    <button class="rec-btn" id="rec-btn">
      <span>🔍</span> Get Recommendations
    </button>

    <div id="results"></div>
  </div>

</div>

<div id="toast">✅ Done!</div>

<script>
const ALGO_INFO = {
  content: "📽 <b>Content-Based Filtering</b> — Recommends movies similar to the selected reference film using genre vectors + cosine similarity.",
  usercf:  "👥 <b>User-Based CF</b> — Finds users with similar taste using Pearson correlation, then recommends what they liked.",
  itemcf:  "🎞 <b>Item-Based CF</b> — Finds movies similar to ones you've already rated and predicts your preferences.",
  svd:     "🔢 <b>SVD Matrix Factorization</b> — Decomposes the rating matrix into latent factors to uncover hidden patterns.",
  hybrid:  "✨ <b>Hybrid Recommender</b> — Blends Content-Based (35%) + Item-CF (35%) + SVD (30%) for best accuracy.",
};

let currentAlgo = "hybrid";

// ── Algorithm tabs ──────────────────────────────────────────────────────────
document.querySelectorAll(".algo-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".algo-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentAlgo = btn.dataset.algo;
    updateAlgoInfo();
    updateControls();
  });
});

function updateAlgoInfo() {
  document.getElementById("algo-info").innerHTML = ALGO_INFO[currentAlgo] || "";
}

function updateControls() {
  const showUser  = currentAlgo !== "content";
  const showMovie = currentAlgo === "content";
  document.getElementById("ctrl-user").style.display  = showUser  ? "" : "none";
  document.getElementById("ctrl-movie").style.display = showMovie ? "" : "none";
}

// ── Recommend ───────────────────────────────────────────────────────────────
document.getElementById("rec-btn").addEventListener("click", async () => {
  const userId  = document.getElementById("user-select").value;
  const movieId = document.getElementById("movie-select").value;
  const topN    = document.getElementById("topn-select").value;

  document.getElementById("results").innerHTML =
    `<div class="loading"><div class="spinner"></div>Generating recommendations…</div>`;

  try {
    const res  = await fetch("/api/recommend", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({algo: currentAlgo, user_id: userId, movie_id: movieId, top_n: topN}),
    });
    const data = await res.json();
    if (data.status === "error") throw new Error(data.message);
    renderResults(data.recommendations);
    showToast("Recommendations ready!");
  } catch(e) {
    document.getElementById("results").innerHTML =
      `<div class="empty"><div class="empty-icon">⚠️</div>${e.message}</div>`;
  }
});

function renderResults(recs) {
  if (!recs || !recs.length) {
    document.getElementById("results").innerHTML =
      `<div class="empty"><div class="empty-icon">🎭</div>No recommendations found.</div>`;
    return;
  }

  const maxScore = Math.max(...recs.map(r => r.score || 0));

  const html = `<div class="results-grid">` + recs.map((r, i) => {
    const pct = maxScore > 0 ? ((r.score / maxScore) * 100).toFixed(1) : 50;
    const tags = (r.genres || "").split("|").map(g =>
      `<span class="genre-tag">${g}</span>`).join("");
    return `
    <div class="movie-card">
      <div class="movie-rank">${i+1}</div>
      <div class="movie-title">${r.title}</div>
      <div class="movie-year">📅 ${r.year}</div>
      <div>${tags}</div>
      <div class="imdb-badge">⭐ IMDb ${r.rating}</div>
      <div class="movie-score-bar">
        <div class="score-label">
          <span>Match Score</span>
          <span>${Number(r.score).toFixed(3)}</span>
        </div>
        <div class="score-track">
          <div class="score-fill" style="width:${pct}%"></div>
        </div>
      </div>
    </div>`;
  }).join("") + `</div>`;

  document.getElementById("results").innerHTML = html;
}

// ── Stats ───────────────────────────────────────────────────────────────────
async function loadStats() {
  try {
    const res  = await fetch("/api/stats");
    const data = await res.json();
    document.getElementById("s-movies").textContent   = data.n_movies;
    document.getElementById("s-users").textContent    = data.n_users;
    document.getElementById("s-ratings").textContent  = data.n_ratings;
    document.getElementById("s-avg").textContent      = data.avg_rating;
    document.getElementById("s-sparsity").textContent = (data.sparsity * 100).toFixed(1) + "%";
  } catch(e) {}
}

// ── Toast ───────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = "✅ " + msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

// ── Init ─────────────────────────────────────────────────────────────────────
updateAlgoInfo();
updateControls();
loadStats();
</script>
</body>
</html>
